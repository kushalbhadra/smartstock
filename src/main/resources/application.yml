spring:
  application:
    name: smartstock

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_USERNAME}
    password: ${SUPABASE_PASSWORD}


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true


  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  devtools:
    restart:
      enabled: true

  jackson:
    default-property-inclusion: non_null
    serialization:
      fail-on-empty-beans: false

  data:
    redis:
      url: ${REDIS_URL}
      ssl:
        enabled: true

server:
  port: 8080

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:3000,https://smartstock.vercel.app}
  bootstrap-admin:
    name: ${SMARTSTOCK_BOOTSTRAP_ADMIN_NAME:}
    email: ${SMARTSTOCK_BOOTSTRAP_ADMIN_EMAIL:}
    password: ${SMARTSTOCK_BOOTSTRAP_ADMIN_PASSWORD:}

logging:
    level:
      org.hibernate.orm.connections.pooling: WARN


groq:
  api:
    key: ${GROQ_API_KEY}
    url: https://api.groq.com/openai/v1/chat/completions
  model: openai/gpt-oss-20b

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000